name: Build Wyrm IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: build-ipa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - run: bash Scripts/fetch-ios-dependencies.sh
      - run: python3 Scripts/prepare-original-engine.py
      - run: xcodegen generate --spec original-engine.yml
      - name: Build for iPhone
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project WyrmOriginalEngine.xcodeproj -scheme WyrmOriginal -configuration Release -sdk iphoneos -derivedDataPath build-original-iphoneos CODE_SIGNING_ALLOWED=NO build 2>&1 | tee original-iphoneos.log
      - name: Package unsigned IPA
        run: |
          APP=build-original-iphoneos/Build/Products/Release-iphoneos/Wyrm.app
          VER=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" 2>/dev/null || echo unknown)
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist" 2>/dev/null || echo unknown)
          mkdir -p original-artifacts/Payload
          ditto "$APP" original-artifacts/Payload/Wyrm.app
          cd original-artifacts
          zip -qry "Wyrm-${VER}-build-${BUILD}-unsigned.ipa" Payload
          rm -rf Payload
          ls -lh *.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v5
        with:
          name: Wyrm-ipa-${{ github.run_number }}
          path: original-artifacts/*.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: build-log-${{ github.run_number }}
          path: |
            original-*.log
            build-original-source/platform-selection.json
          if-no-files-found: ignore
          retention-days: 7
